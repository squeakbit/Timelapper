org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Do not derive Kotlin/Java bytecode target from the JDK running Gradle.
# The project targets JVM 17; Android Studio may itself run on JDK 25.

# AGP 9.0+ ships "built-in Kotlin" enabled by default, which registers its
# own 'kotlin' extension and conflicts with our explicit application of the
# org.jetbrains.kotlin.android plugin ("Cannot add extension with name
# 'kotlin', as there is an extension already registered with that name.").
# Opt back out until the project is deliberately migrated to built-in Kotlin.
# See: https://developer.android.com/build/migrate-to-built-in-kotlin
android.builtInKotlin=false
# kotlin-android is not compatible with AGP's new DSL, so this must be
# disabled too whenever builtInKotlin is disabled.
android.newDsl=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
